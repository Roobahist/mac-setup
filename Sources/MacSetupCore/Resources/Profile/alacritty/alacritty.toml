# ~/.config/alacritty/alacritty.toml

# Window configuration
[window]
padding.x = 10
padding.y = 10
decorations = "Buttonless"
opacity = 0.85
decorations_theme_variant = "Light"
blur=true

# Font setup
[font]
# Mandatory declaration of normal font
normal = { family = "JetBrains Mono", style = "Regular" }
# Optional: set bold/italic if you want specific variants
bold = { family = "JetBrains Mono", style = "Bold" }
italic = { family = "JetBrains Mono", style = "Italic" }
bold_italic = { family = "JetBrains Mono", style = "Bold Italic" }
size = 14.0

# Scrolling
[scrolling]
history = 10000
multiplier = 3

# Colors – simple dark theme
[colors.primary]
foreground = "#dcdcdc"
background = "#1e1e1e"

[colors.cursor]
text = "CellBackground"
cursor = "CellForeground"

# Live reload
[general]
live_config_reload = true
import = [
    "~/.config/alacritty/themes/themes/github_dark.toml"
]
