name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check SwiftUI property wrapper compatibility
        run: python3 scripts/check-swiftui-state.py
      - name: Test with isolated homes and fake system commands
        run: swift test --build-system native
      - name: Smoke-test CLI commands
        run: |
          swift run --build-system native mac-setup --version
          swift run --build-system native mac-setup profiles
          swift run --build-system native mac-setup plan --preset minimal > /dev/null
          swift run --build-system native mac-setup dotfiles status
      - name: Test keyboard-driven terminal navigation
        run: python3 scripts/test-interactive-picker.py "$(swift build --build-system native --show-bin-path)/mac-setup"
      - name: Test wallpaper accent pipeline
        run: python3 scripts/test-wallpaper-accent.py
      - name: Validate public profile
        run: python3 scripts/check-profile.py
      - name: Validate shell scripts
        run: |
          bash -n scripts/package.sh scripts/install.sh scripts/build.sh install.sh mac-setup
          find Sources/MacSetupCore/Resources/Profile -name '*.sh' -exec bash -n {} \;
      - name: Build a downloadable preview
        run: bash scripts/package.sh arm64 preview
      - uses: actions/upload-artifact@v4
        with:
          name: mac-setup-preview-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7

  # Build against the Xcode 27 SwiftUI SDK as well as the older CI image.
  # When CLT is installed on the runner, also compile without Xcode selected.
  xcode-27-compat:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Verify SwiftUI macro toolchain and compile targets
        run: |
          xcode-select -p
          swift --version
          swift test --build-system native
      - name: Build native app bundle
        run: bash scripts/package.sh arm64 preview
      - name: Build with standalone Command Line Tools when available
        shell: bash
        run: |
          if [[ -x /Library/Developer/CommandLineTools/usr/bin/swiftc ]]; then
            echo "Testing without Xcode using standalone Command Line Tools"
            DEVELOPER_DIR=/Library/Developer/CommandLineTools \
              MAC_SETUP_BUILD_DIR=.build/clt bash scripts/build.sh -c release
          else
            echo "::notice::Standalone Command Line Tools are absent from this runner; source lint and Xcode 27 compilation still run."
          fi
